app = "wormed-exhibit"
primary_region = "yyz"

[build]

[mounts]
  source = "exhibit_data"
  destination = "/data"

# One public port. The relay serves /api itself and proxies /fly to the model (relay.mjs).
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
