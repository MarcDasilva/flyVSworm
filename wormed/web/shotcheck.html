<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C. elegans on Thru</title>
<style>
  body { margin: 0; overflow: hidden; background: #0b0f14;
         font: 14px ui-monospace, SFMono-Regular, monospace; color: #cbd5e1; }
  #ui { position: fixed; top: 16px; left: 16px; display: flex; gap: 8px;
        z-index: 2; }
  button { padding: 10px 16px; background: #1e293b; color: #e2e8f0;
           border: 1px solid #334155; border-radius: 6px; cursor: pointer;
           font: inherit; }
  button:hover { background: #334155; }
  /* The signature rows are LINKS into the explorer, so this panel must accept
     clicks. */
  #txpanel { position: fixed; left: 16px; top: 68px; width: 430px;
             max-height: calc(100vh - 110px); display: flex;
             flex-direction: column;
             background: rgba(10,15,22,0.72); border: 1px solid #1e293b;
             border-radius: 8px; backdrop-filter: blur(6px); }
  #txtitle { padding: 9px 12px 7px; font-size: 10px; letter-spacing: 0.12em;
             color: #94a3b8; border-bottom: 1px solid #1e293b;
             display: flex; justify-content: space-between; }
  #txtitle .dot { color: #4ade80; }
  #txpause { padding: 0 7px; font-size: 10px; letter-spacing: 0.08em;
             border-radius: 4px; pointer-events: auto; }
  #txstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
             background: #1e293b; border-bottom: 1px solid #1e293b; }
  #txstats div { background: #0b111a; padding: 7px 10px 8px; }
  #txstats .k { font-size: 9px; letter-spacing: 0.1em; color: #64748b; }
  #txstats .v { font-size: 15px; color: #e2e8f0; margin-top: 2px; }
  #txstats .v.warn { color: #fbbf24; }
  #feed { padding: 6px 0 8px; overflow: hidden; font-size: 11px;
          line-height: 1.7; }
  /* The row whose transfers are CURRENTLY drawing as particles. Without this
     the panel is a log next to an animation; with it they are one thing. */
  #feed .row { padding: 1px 12px; white-space: pre; border-left: 2px solid transparent; }
  #feed .row.live { background: rgba(56,189,248,0.10); border-left-color: #38bdf8; }
  #feed .row.fail { color: #f87171; }
  #feed .dim { color: #64748b; }
  #feed a { color: #7dd3fc; text-decoration: none; }
  #feed a:hover { text-decoration: underline; }
  /* The title card, top right — the exhibits are composed left of centre in
     the opening shot, see OPENING_FIXED in main.ts. The whole card fades as
     ONE element so the badge and its button leave together; fading rather
     than unmounting keeps the layout still while the camera is moving. */
  #intro { position: fixed; right: 12vw; top: 4vh; z-index: 3;
           display: flex; flex-direction: column; align-items: center;
           gap: 18px; transition: opacity 700ms ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  /* vw-capped so the badge cannot swallow the scene on a narrow window. The
     intrinsic width/height on the tag itself reserves the box before the PNG
     arrives, or the button jumps when it does. */
  #vs { display: block; width: min(340px, 26vw); height: auto; }
  /* Chunky arcade button, to match a cartoon badge rather than the slate
     chrome the touch buttons use. The ID beats `button:hover` on specificity,
     so the gradient survives the hover rule above instead of being flattened
     back to slate. The offset shadow is the button's THICKNESS — press state
     shortens it and drops the face onto it, which is what sells the click. */
  #enter { padding: 15px 46px; font-size: 15px; font-weight: 700;
           letter-spacing: 0.28em; color: #fff;
           background: linear-gradient(180deg, #fbbf24 0%, #f97316 42%, #dc2626 100%);
           border: 2px solid #1a1110; border-radius: 999px;
           text-shadow: 0 2px 0 rgba(0,0,0,0.42);
           box-shadow: 0 5px 0 #7f1d1d, 0 12px 20px rgba(0,0,0,0.45);
           transition: transform 120ms ease, box-shadow 120ms ease,
                       filter 120ms ease; }
  #enter:hover { filter: brightness(1.08); transform: translateY(-2px);
                 box-shadow: 0 7px 0 #7f1d1d, 0 16px 24px rgba(0,0,0,0.5); }
  #enter:active { transform: translateY(3px);
                  box-shadow: 0 2px 0 #7f1d1d, 0 5px 10px rgba(0,0,0,0.45); }
  #hint { position: fixed; left: 16px; bottom: 16px; font-size: 11px;
          opacity: 0.55; }
  /* CC BY 4.0 requires the credit to be shown, so it is not inside the reveal. */
  #credit { position: fixed; right: 16px; bottom: 16px; font-size: 10px;
            opacity: 0.4; }
  #credit a { color: inherit; }
</style></head>
<body>
  <div id="ui">
    <button id="mute" aria-pressed="false" aria-label="Mute sound">
      <svg class="on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
  </div>
  <div id="txpanel">
    <div id="txtitle"><span>LIVE TRANSACTIONS &middot; THRU ALPHANET</span><span><button id="txpause">PAUSE</button> <span class="dot">&#9679;</span></span></div>
    <div id="txstats"></div>
    <div id="feed"></div>
  </div>
  <div id="intro">
    <img id="vs" src="/fly-vs-worms.png" width="720" height="580" alt="Fly vs Worms">
    <button id="enter">ENTER</button>
  </div>
  <div id="hint">click the tank to look closer &middot; drag to orbit &middot; scroll to zoom &middot; live on Thru alphanet</div>
  <div id="credit"><a href="https://sketchfab.com/3d-models/fly-6a4470f884554864827d848718b2b6bc" target="_blank" rel="noreferrer">&ldquo;Fly&rdquo; by victorberdugo1</a> &middot; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a></div>
  <script type="module">
// Headless check only. main.ts drives an endless rAF loop, and under Chrome's
// virtual clock that never lets the screenshot land — cap the frames.
let n = 0;
const raf = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = cb => (n++ < 30 ? raf(cb) : 0);

</script>
<script type="module" src="/src/main.ts"></script>
</body></html>
